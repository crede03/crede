<div class="page-content minesweeper-content">
    <div class="minesweeper-window-inner">
        <ul role="menubar" class="can-hover" style="margin: 0 0 6px 0;">
            <li role="menuitem" tabindex="0" id="ms-new-game-btn">New Game</li>
            <li role="menuitem" tabindex="0" id="ms-diff-beginner">Beginner</li>
            <li role="menuitem" tabindex="0" id="ms-diff-intermediate">Intermediate</li>
        </ul>
        <div class="minesweeper-header">
            <div class="ms-counter" id="ms-mine-counter">010</div>
            <button class="ms-face-btn" id="ms-face-btn" aria-label="Reset game">🙂</button>
            <div class="ms-counter" id="ms-timer">000</div>
        </div>
        <div class="minesweeper-board-container">
            <div class="minesweeper-board" id="minesweeper-board"></div>
        </div>
        <div class="minesweeper-status" id="minesweeper-status" style="font-size: 11px; text-align: center; margin-top: 6px; color: #555;">
            Left click to reveal, Right click to flag.
        </div>
    </div>
</div>
