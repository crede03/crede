<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winamp</title>
    <style>
        html,
        body,
        #webamp-root {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            position: relative;
            background: transparent;
        }

        #webamp-root {
            position: absolute;
            left: 0;
            top: 0;
            width: 1px;
            height: 1px;
        }
    </style>
</head>
<body>
    <div id="webamp-root" aria-label="Personal Webamp instance"></div>

    <script type="module">
        import Webamp from "https://unpkg.com/webamp@^2";

        const root = document.getElementById("webamp-root");

        if (!Webamp.browserIsSupported()) {
            root.textContent = "Webamp is not supported by this browser.";
        } else {
            const webamp = new Webamp({
                enableHotkeys: false,
                enableMediaSession: true,
                windowLayout: {
                    main: { position: { x: 140, y: 120 } },
                    equalizer: { position: { x: 140, y: 236 } },
                    playlist: { position: { x: 140, y: 352 }, size: [0, 4] },
                },
            });

            webamp.renderWhenReady(root).catch((error) => {
                root.textContent = "Webamp could not be loaded.";
                console.error("Unable to initialize Webamp", error);
            });
        }
    </script>
</body>
</html>
